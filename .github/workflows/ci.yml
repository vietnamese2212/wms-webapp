# CI mỗi lần push dev/main — "pipeline đi tuần" thay vì chờ người nhớ chạy tay (chốt 29/07).
# 2 tầng:
#   static  — tsc BE+FE + cổng tĩnh ratchet + build FE. KHÔNG cần secret, chạy được ngay.
#   qa-smoke — chờ Vercel Preview build xong đúng commit này (poll /api/version) rồi bắn các gói
#              QA read-only (invariant + params-fuzz + perm-coverage). Cần secrets — thiếu thì SKIP
#              có chủ đích (in hướng dẫn), không đỏ oan.
# Secrets cần khai 1 lần (Settings → Secrets and variables → Actions):
#   QA_DATABASE_URL  = SUPABASE_URL|SERVICE_ROLE_KEY của STAGING, nối bằng dấu | (2 giá trị 1 secret)
#     (chỉ staging — TUYỆT ĐỐI không đặt key production vào đây)
# KHÔNG cần secret tài khoản: từ 07/09 CI TỰ CẤP một tài khoản QA sống vài phút bằng chính khoá
# dịch vụ trên rồi xoá (scripts/qa/ci-account.mjs). Hai secret cũ QA_ADMIN_EMAIL / QA_ADMIN_PASSWORD
# nay THỪA — xoá được. Lý do bỏ: bản chép tay lỗi thời vào đúng lúc không ai để ý, và mỗi lần chạy
# lại đốt một lần ĐOÁN SAI lên tài khoản thật (auth_throttle khoá sau 10 lần sai/15 phút — đo thật
# 06–07/09: 9 job đỏ liên tiếp cùng một gốc).
# Gói race/scale KHÔNG chạy ở đây (có ghi dữ liệu — chạy tay/đêm, tránh đè giờ demo).
name: ci
on:
  push:
    branches: [dev, main]
  workflow_dispatch: {}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }   # 22 = có WebSocket native; supabase-js v2.105 ném lỗi lúc createClient trên Node 20 (CI đỏ 11/09)
      - name: Cài dependency (BE + FE)
        run: |
          cd backend && npm ci --no-audit --no-fund &
          cd frontend && npm ci --no-audit --no-fund &
          wait
      - name: Cổng tĩnh ratchet (as any / split(',') / timezone / nhãn quy đổi)
        run: node scripts/qa/09-static-gate.mjs
      - name: Lỗ hổng thư viện (npm audit ratchet — high/critical không được tăng so audit-baseline.json)
        run: node scripts/qa/44-npm-audit.mjs
      # 11/09: hai lưới rẻ nhất, không cần server — helper thuần + mirror BE⇄FE (vài giây) và ratchet độ phủ
      # (route/quyền mới chưa gói QA nào chạm → đỏ ngay, không chờ đợt kiểm toàn app).
      - name: Test đơn vị + mirror BE⇄FE (vitest)
        run: cd backend && npm test --silent
      - name: Ratchet độ phủ QA (route/quyền mới phải có phép kiểm chạm)
        run: node scripts/qa/coverage-surface.mjs --ratchet
      - name: tsc backend
        run: cd backend && npx tsc --noEmit
      - name: tsc + build frontend
        run: cd frontend && npx tsc --noEmit && npm run build

  qa-smoke:
    # Chỉ dev: main deploy production — không bắn QA vào production.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # 11/09: ngày 10/09 có 30 lượt push ⇒ 30 lượt qa-smoke nối đuôi, 5 lượt đỏ = 5 email cho cùng một
    # trạng thái staging. Push mới thì HUỶ lượt cũ đang chờ Preview (lượt bị huỷ không gửi email, và
    # kết quả của nó cũng vô nghĩa vì Preview đã đổi commit). Bước thu hồi tài khoản vẫn chạy (always()).
    concurrency: { group: qa-smoke-dev, cancel-in-progress: true }
    env:
      PREVIEW_URL: https://wms-webapp-git-dev-vietnamese2212s-projects.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }   # 22 = có WebSocket native; supabase-js v2.105 ném lỗi lúc createClient trên Node 20 (CI đỏ 11/09)
      - name: Chờ Vercel Preview build ĐÚNG commit này (poll /api/version, tối đa 12')
        run: |
          for i in $(seq 1 72); do
            sha=$(curl -s --max-time 15 "$PREVIEW_URL/api/version" | grep -o '"sha":"[a-f0-9]*"' | cut -d'"' -f4 || true)
            echo "lần $i: preview=$sha cần=$GITHUB_SHA"
            if [ "$sha" = "$GITHUB_SHA" ]; then echo "Preview ĐÃ live đúng commit"; exit 0; fi
            sleep 10
          done
          echo "::error::Preview không lên đúng commit sau 12 phút (Vercel build fail?)"; exit 1
      - name: Dựng env cho bộ QA (từ secret — thiếu thì skip có chủ đích)
        id: qaenv
        run: |
          if [ -z "${{ secrets.QA_DATABASE_URL }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa khai secret QA_DATABASE_URL — bỏ qua QA smoke (chỉ chạy static). Khai ở Settings→Secrets: SUPABASE_URL|SERVICE_ROLE_KEY (staging) nối bằng dấu |"
          else
            IFS='|' read -r url key <<< "${{ secrets.QA_DATABASE_URL }}"
            mkdir -p backend
            printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$url" "$key" > backend/.env
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # TÀI KHOẢN CHẠY BỘ KIỂM = CẤP LÚC CHẠY, XOÁ NGAY SAU ĐÓ (user chốt 07/09).
      # Không còn cặp email/mật khẩu chép tay trong Secrets — bản chép tay lỗi thời vào đúng lúc
      # không ai để ý, và mỗi lần chạy lại đốt một lần ĐOÁN SAI lên tài khoản thật (khoá sau 10 lần
      # sai/15 phút). Khoá dịch vụ vốn đã có sẵn trong QA_DATABASE_URL nên không cần thêm secret nào.
      - name: Cấp tài khoản QA tạm cho lượt chạy này
        id: qacred
        if: steps.qaenv.outputs.skip == 'false'
        run: |
          npm i bcryptjs@2.4.3 --no-save --no-audit --no-fund >/dev/null 2>&1
          out=$(node scripts/qa/ci-account.mjs provision) || { echo "::error::Không cấp được tài khoản QA tạm"; exit 1; }
          email=$(printf '%s\n' "$out" | sed -n 's/^email=//p')
          pass=$(printf '%s\n' "$out" | sed -n 's/^password=//p')
          echo "::add-mask::$pass"
          { echo "QA_ADMIN_EMAIL=$email"; echo "QA_ADMIN_PASSWORD=$pass"; } >> "$GITHUB_ENV"
      - name: "QA read-only: invariant + params-fuzz + perm-coverage"
        if: steps.qaenv.outputs.skip == 'false'
        env:
          QA_BASE_URL: ${{ env.PREVIEW_URL }}
        # Mỗi gói một khối + ::error nêu TÊN GÓI khi gói chết mà không kịp in phép kiểm nào (crash/đăng nhập
        # hỏng) — 3/6 lượt đỏ ngày 10/09 chỉ có dòng "Process completed with exit code 1", không biết gói nào.
        run: |
          rc=0
          for p in 00-invariant 07-params-fuzz 08-perm-coverage; do
            echo "::group::$p"
            if ! node "scripts/qa/$p.mjs"; then echo "::error title=QA gói $p ĐỎ::xem khối $p trong log"; rc=1; fi
            echo "::endgroup::"
          done
          exit $rc
      # always(): bộ kiểm đỏ thì tài khoản vẫn phải bị thu hồi — không để lại tài khoản superadmin
      # sống lay lắt trên staging vì một job fail.
      - name: Thu hồi tài khoản QA tạm
        if: always() && steps.qacred.outcome == 'success'
        run: node scripts/qa/ci-account.mjs cleanup
